<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule - Herco Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/output.css">
</head>
<body>

<div id="app">
  <div id="pageRoot"></div>
</div>

<div class="modal-overlay hidden" id="confirmRescheduleModal">
  <div class="rs-confirm-modal">
    <div class="rs-cm-hdr">
      <div class="rs-cm-icon"><i class="fas fa-calendar-alt"></i></div>
      <div>
        <h3>Confirm Reschedule</h3>
        <p>Enter your password to proceed</p>
      </div>
    </div>
    <div class="rs-cm-body">
      <div class="modal-msg" id="rsConfirmMsg"></div>

      <div class="rs-detail-box">
        <div class="rsdb-row"><span>Service</span><span id="rs_confirm_service">-</span></div>
        <div class="rsdb-row"><span>From</span><span id="rs_confirm_from">-</span></div>
        <div class="rsdb-row"><span>To</span><span id="rs_confirm_to">-</span></div>
        <div class="rsdb-row"><span>Bookings to Move</span><span id="rs_confirm_count">-</span></div>
      </div>

      <div class="info-note">
        <i class="fas fa-envelope"></i>
        Customers who have email addresses will automatically receive a reschedule notification.
      </div>

      <div class="rs-field">
        <label><i class="fas fa-lock"></i> Re-enter your password to confirm <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="rsConfirmPassword" placeholder="Your admin password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="rsPwToggle">
            <i class="fas fa-eye" id="rsPwIcon"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="rs-cm-foot">
      <button class="btn-secondary" id="rsCancelBtn">Cancel</button>
      <button class="btn-primary" id="rsExecuteBtn">
        <i class="fas fa-calendar-alt"></i> Execute Reschedule
      </button>
    </div>
  </div>
</div>


<script src="/admin/admin-layout.js"></script>
<script src="reschedule.js"></script>
</body>
</html>
