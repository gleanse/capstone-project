<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Herco Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/output.css">
</head>
<body>

<div id="app">
  <div class="page-header">
    <div>
      <h1 class="page-title">Staff Accounts</h1>
      <p class="page-sub">Manage admin and staff access</p>
    </div>
    <div class="page-actions">
      <button class="btn-primary" id="addStaffBtn">
        <i class="fas fa-user-plus"></i> Add Account
      </button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody id="staffTableBody">
          <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="addStaffModal">
  <div class="staff-modal">
    <div class="staff-modal-header">
      <h3><i class="fas fa-user-plus"></i> Add Account</h3>
      <button class="modal-close" id="addStaffModalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="staff-modal-body">
      <div class="modal-msg" id="addStaffMsg"></div>

      <div class="m-field">
        <label><i class="fas fa-user"></i> Full Name <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <input type="text" id="staff_name" placeholder="Juan Dela Cruz" autocomplete="off">
        <span class="field-err" id="staff_nameErr"></span>
      </div>

      <div class="m-field">
        <label><i class="fas fa-envelope"></i> Email Address <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <input type="email" id="staff_email" placeholder="juan@herco.com" autocomplete="off">
        <span class="field-err" id="staff_emailErr"></span>
      </div>

      <div class="m-field">
        <label><i class="fas fa-id-badge"></i> Role <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <select id="staff_role">
          <option value="">-- Select role --</option>
          <option value="admin">Admin - Full access</option>
          <option value="staff">Staff - Daily operations</option>
        </select>
        <span class="field-err" id="staff_roleErr"></span>
      </div>

      <div class="m-field">
        <label><i class="fas fa-lock"></i> Password <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="staff_password" placeholder="Min. 8 characters" autocomplete="new-password">
          <button type="button" class="pw-toggle" id="toggleStaffPw">
            <i class="fas fa-eye" id="staffPwIcon"></i>
          </button>
        </div>
        <div class="pw-strength" id="staffPwStrength">
          <div class="strength-bar"><div class="strength-fill" id="staffStrengthFill"></div></div>
          <span class="strength-label" id="staffStrengthLabel">Password strength</span>
        </div>
        <span class="field-err" id="staff_passwordErr"></span>
      </div>

      <div class="m-field">
        <label><i class="fas fa-lock"></i> Confirm Password <span style="color:var(--color-admin-danger, #dc2626)">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="staff_confirm" placeholder="Repeat password" autocomplete="new-password">
        </div>
        <span class="field-err" id="staff_confirmErr"></span>
      </div>
    </div>
    <div class="staff-modal-footer">
      <button class="btn-secondary" id="addStaffModalCancel">Cancel</button>
      <button class="btn-primary" id="addStaffModalSave">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="deleteStaffModal">
  <div class="confirm-modal">
    <div class="confirm-icon"><i class="fas fa-user-times"></i></div>
    <h4>Remove Account?</h4>
    <p id="deleteStaffMsg">This will permanently remove the account.</p>
    <div class="confirm-btns">
      <button class="btn-secondary" id="deleteStaffCancel">Cancel</button>
      <button class="btn-danger" id="deleteStaffConfirm"><i class="fas fa-user-times"></i> Remove</button>
    </div>
  </div>
</div>


<script src="/admin/admin-layout.js"></script>
<script src="staff.js"></script>
</body>
</html>
