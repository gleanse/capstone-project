services:
  postgres:
    image: postgres:17
    container_name: capstone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/current-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/database/seeds/overall.sql:/docker-entrypoint-initdb.d/2-seeds.sql

volumes:
  postgres_data: